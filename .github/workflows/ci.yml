name: Verify release artifacts

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install project and development tools
        run: python -m pip install ".[dev]"
      - name: Run full test suite
        run: python -B -m pytest -p no:cacheprovider -q
      - name: Build wheel, sdist, and separate Agent Skill
        run: |
          python -m build
          python -c "import shutil; shutil.make_archive('dist/skillvariants-skill', 'zip', 'skills', 'skillvariants')"
          python -m twine check dist/*.whl dist/*.tar.gz
      - name: Test installed wheel in an isolated environment
        run: |
          python - <<'PY'
          import os, pathlib, subprocess, sys, tomllib, venv
          root = pathlib.Path.cwd()
          wheels = list((root / 'dist').glob('*.whl'))
          assert len(wheels) == 1, 'Expected exactly one wheel'
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'skillvariants-wheel'
          venv.EnvBuilder(with_pip=True).create(target)
          python = target / ('Scripts/python.exe' if os.name == 'nt' else 'bin/python')
          env = dict(os.environ)
          env.pop('PYTHONPATH', None)
          subprocess.run([str(python), '-m', 'pip', 'install', str(wheels[0])], check=True, env=env)
          version = tomllib.loads((root / 'pyproject.toml').read_text())['project']['version']
          subprocess.run([str(python), '-B', str(root / 'scripts/package_smoke.py'), '--expected-version', version],
                         cwd=os.environ['RUNNER_TEMP'], env=env, check=True)
          PY
      - name: Verify selected distributions, provenance, Skill, and web export
        run: |
          python - <<'PY'
          import pathlib, subprocess, sys
          wheels = list(pathlib.Path('dist').glob('*.whl'))
          sdists = list(pathlib.Path('dist').glob('*.tar.gz'))
          assert len(wheels) == len(sdists) == 1, 'Expected exactly one wheel and sdist'
          subprocess.run([sys.executable, 'scripts/release_qa.py', '--wheel', str(wheels[0]),
                          '--sdist', str(sdists[0]), '--skill-archive', 'dist/skillvariants-skill.zip'], check=True)
          PY
      - name: Retain exact tested artifacts
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: verified-release-artifacts
          path: dist/*
          if-no-files-found: error
          retention-days: 14
