name: Release to PyPI

on:
  push:
    tags: ["v*"]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      # Required for PyPI Trusted Publishing (OIDC). If you instead use an
      # API token secret, see the alternative in the publish step.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build twine
      - name: Build distributions
        run: python -m build
      - name: Twine metadata check
        run: python -m twine check dist/*
      # Preferred path: Trusted Publishing. One-time setup on pypi.org —
      # account settings → publishing → add a *pending publisher* with:
      #   owner: ppplkmvvb   repository: skillvariants
      #   workflow: release.yml    environment left empty (or set both sides)
      - name: Publish (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: false
      # Alternative path without Trusted Publishing: store an API token as the
      # repository secret PYPI_API_TOKEN, then replace the step above with:
      #   env:
      #     TWINE_USERNAME: __token__
      #     TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      #   run: twine upload --non-interactive dist/*
