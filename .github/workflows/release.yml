name: Publish verified release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          name: verified-release-artifacts
          path: verified-dist
      - name: Require tag and tested artifact versions to match
        run: |
          python - <<'PY'
          import email.parser, os, pathlib, shutil, tarfile, tomllib, zipfile
          version = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']
          assert os.environ['GITHUB_REF_NAME'] == 'v' + version, 'Tag must match package version'
          wheels = list(pathlib.Path('verified-dist').glob('*.whl'))
          sdists = list(pathlib.Path('verified-dist').glob('*.tar.gz'))
          assert len(wheels) == len(sdists) == 1, 'Expected exact tested distributions'
          with zipfile.ZipFile(wheels[0]) as z:
              names = [n for n in z.namelist() if n.endswith('.dist-info/METADATA')]
              assert len(names) == 1
              metadata = email.parser.BytesParser().parsebytes(z.read(names[0]))
              assert metadata['Version'] == version and metadata['Name'] == 'skillvariants'
          with tarfile.open(sdists[0], 'r:gz') as archive:
              names = [m for m in archive.getmembers() if m.name.count('/') == 1 and m.name.endswith('/PKG-INFO')]
              assert len(names) == 1
              metadata = email.parser.BytesParser().parsebytes(archive.extractfile(names[0]).read())
              assert metadata['Version'] == version and metadata['Name'] == 'skillvariants'
          pathlib.Path('publish-dist').mkdir()
          for artifact in wheels + sdists:
              shutil.copyfile(artifact, pathlib.Path('publish-dist') / artifact.name)
          PY
      - name: Publish the exact verified wheel and sdist
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: publish-dist/
          skip-existing: false
